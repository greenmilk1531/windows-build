name: Build Greenmilk Launcher EXE

# main 브랜치에 코드가 푸시(업로드)될 때마다 자동으로 실행됩니다.
on:
  push:
    branches: [ main ] 

jobs:
  build:
    # 깃허브가 제공하는 최신 윈도우 환경에서 작업하겠다는 의미입니다.
    runs-on: windows-latest

    steps:
    - name: 1. 내 런처 코드 가져오기
      uses: actions/checkout@v4

    - name: 2. 파이썬 설치하기
      uses: actions/setup-python@v5
      with:
        python-version: '3.11' 

    - name: 3. 필수 라이브러리 및 PyInstaller 설치
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: 4. EXE 파일 빌드하기 (명령어 실행)
      run: |
        pyinstaller --noconsole --onefile --collect-all customtkinter app.py

    - name: 5. 완성된 결과물(Artifact) 저장하기
      uses: actions/upload-artifact@v4
      with:
        name: Greenmilk-Launcher-Windows
        path: dist/app.exe
