name: Build Executable

on:
  push:
    tags:
      - 'v*' # v1.0, v2.0.0 등의 태그가 push될 때 실행

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-level: '3.10' # 사용할 파이썬 버전

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller yt-dlp
        # 만약 requirements.txt가 있다면 아래 주석을 해제하세요
        # pip install -r requirements.txt

    - name: Build with PyInstaller
      run: |
        # --onefile: 단일 exe 파일로 빌드
        # --noconsole: GUI 프로그램이므로 터미널 창이 뜨지 않도록 설정
        # main.py 부분을 실제 본인의 파이썬 파일명으로 변경하세요.
        pyinstaller --onefile --noconsole main.py

    - name: Upload Release Asset
      uses: softprops/action-gh-release@v2
      with:
        files: dist/main.exe # PyInstaller가 생성한 exe 파일 경로
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
